[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pc2bs"
dynamic = ["version"]
description = "CLI: point-cloud Spacewalk .sw → ball-and-stick (h5py, one-way)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.10",
    "numpy>=1.24",
]

[project.scripts]
pc2bs = "pc2bs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
pc2bs = ["assets/*.html"]

[tool.setuptools_scm]
# Derive version from Git tags (e.g. v0.2.0). Untagged commits get a dev suffix.

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
