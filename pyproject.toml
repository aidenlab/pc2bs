[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pc2sw"
version = "0.1.0"
description = "CLI: convert a point-cloud Spacewalk .sw file to ball-and-stick (h5py, one-way)."
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.10",
    "numpy>=1.24",
]

[project.scripts]
pc2sw = "pc2sw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
