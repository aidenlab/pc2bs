[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pc2bs"
version = "0.1.0"
description = "CLI: point-cloud Spacewalk .sw → ball-and-stick (h5py, one-way)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.10",
    "numpy>=1.24",
    "hdf5-indexer @ git+https://github.com/jrobinso/hdf5-indexer",
]

[project.scripts]
pc2bs = "pc2bs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
pc2bs = ["assets/*.html"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
